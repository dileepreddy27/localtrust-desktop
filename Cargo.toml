[package]
name = "localtrust-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Approval-gated local file operations for LocalTrust Desktop"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }

[build-dependencies]
cc = "1"

[dev-dependencies]
tempfile = "3"
